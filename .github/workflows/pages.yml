name: Deploy documentation site
# Single authoritative GitHub Pages workflow
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/labs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/labs
          cp docs/site/index.html _site/index.html
          cp -R docs/site/assets/. _site/assets/
          cp docs/labs/*.md _site/labs/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/assets/site.css
          test -f _site/assets/site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
